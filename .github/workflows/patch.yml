
name: RHEL Patching

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Validate playbook
        run: |
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/patch.yml \
            --syntax-check

  patch-test:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, ansible]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Ansible patching
        run: |
          ansible-playbook \
            -i inventory/hosts.ini \
            playbooks/patch.yml \
            --limit rhel-test-01
