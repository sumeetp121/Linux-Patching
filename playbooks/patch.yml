
---
- name: Patch RHEL test servers
  hosts: rhel_test
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Check operating system
      ansible.builtin.debug:
        msg: "Preparing to patch {{ inventory_hostname }} running {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

    - name: Update installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_only: true
